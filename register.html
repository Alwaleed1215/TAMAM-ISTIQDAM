<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="registerTitlePage">إنشاء حساب وكيل | بوابة الشركاء - مكتب تمام</title>
    
    <link rel="icon" type="image/png" href="https://imgg.io/images/2026/03/22/3905f931b0fa4f5e93531423df3036d8.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        primary: '#112240', secondary: '#eab308', whatsapp: '#25D366'
                    },
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeInUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; overflow-x: hidden; width: 100%; transition: background-color 0.3s, color 0.3s; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #112240; border-radius: 10px; }
        html.dark ::-webkit-scrollbar-thumb { background: #eab308; }
        
        .form-input { @apply w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all text-slate-800 dark:text-slate-100 shadow-inner; }
        
        .upload-zone { @apply border-2 border-dashed border-gray-300 dark:border-slate-600 rounded-2xl p-6 text-center cursor-pointer transition-all hover:border-secondary hover:bg-slate-50 dark:hover:bg-slate-800/50 flex flex-col items-center justify-center gap-3; }
        
        .floating-shape { position: absolute; z-index: -1; filter: blur(40px); opacity: 0.5; animation: float 10s infinite ease-in-out alternate; }
        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-20px) scale(1.05); } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col min-h-screen relative" id="body-content">

    <div class="floating-shape bg-secondary/20 dark:bg-secondary/10 w-64 h-64 rounded-full top-20 right-10"></div>
    <div class="floating-shape bg-primary/20 dark:bg-blue-500/10 w-96 h-96 rounded-full bottom-20 left-10" style="animation-delay: -5s;"></div>

    <header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md shadow-sm sticky top-0 z-30 border-b border-slate-100 dark:border-slate-800 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <a href="index.html" class="flex-shrink-0 flex items-center h-full py-1 group">
                <img src="https://imgg.io/images/2026/03/22/ce7f90873f720d041ffcdb63cfe66b05.png" alt="مكتب تمام للاستقدام" class="h-14 md:h-16 object-contain dark:brightness-0 dark:invert transition-transform group-hover:scale-105">
            </a>
            
            <div class="flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="text-primary dark:text-secondary text-lg hover:scale-110 transition-transform focus:outline-none" id="darkModeBtn"><i class="fa-solid fa-moon"></i></button>
                <button onclick="switchLanguage()" class="text-[10px] border border-primary/20 dark:border-secondary/30 px-2 py-1 rounded bg-slate-50 dark:bg-slate-800 text-primary dark:text-white font-bold hover:bg-primary hover:text-white dark:hover:bg-secondary dark:hover:text-primary transition-colors">EN/AR</button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-10 px-4 relative z-10">
        
        <div class="w-full max-w-[650px] bg-white dark:bg-slate-800 rounded-[2rem] shadow-2xl border border-slate-100 dark:border-slate-700 p-8 opacity-0 animate-fade-in-up">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl md:text-3xl font-extrabold text-primary dark:text-white mb-2" data-i18n="registerTitle">تسجيل مكتب جديد</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm font-semibold" data-i18n="registerSubtitle">قم بإنشاء حسابك وإضافة أول سيرة ذاتية للعمالة</p>
            </div>

            <form action="#" method="POST" class="space-y-5" onsubmit="event.preventDefault(); alert('تم استلام الطلب بنجاح...');">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2" data-i18n="officeName">اسم المكتب</label>
                        <div class="relative">
                            <input type="text" required class="form-input rtl:pr-10 ltr:pl-10" placeholder="مثال: مكتب النجوم للاستقدام">
                            <i class="fa-solid fa-building absolute rtl:right-3 ltr:left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2" data-i18n="workerCountry">بلد العمالة المتاحة</label>
                        <div class="relative">
                            <select required class="form-input rtl:pr-10 ltr:pl-10 appearance-none bg-no-repeat bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239CA3AF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E')] rtl:bg-[position:left_1rem_center] ltr:bg-[position:right_1rem_center] bg-[length:0.8rem_auto]">
                                <option value="" disabled selected data-i18n="selectCountry">اختر الدولة...</option>
                                <option value="philippines">الفلبين</option>
                                <option value="indonesia">إندونيسيا</option>
                                <option value="sri_lanka">سريلانكا</option>
                                <option value="kenya">كينيا</option>
                                <option value="uganda">أوغندا</option>
                                <option value="bangladesh">بنجلاديش</option>
                                <option value="india">الهند</option>
                                <option value="other">دولة أخرى</option>
                            </select>
                            <i class="fa-solid fa-earth-americas absolute rtl:right-3 ltr:left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2" data-i18n="loginEmail">البريد الإلكتروني (لتسجيل الدخول)</label>
                        <div class="relative">
                            <input type="email" required class="form-input rtl:pr-10 ltr:pl-10" placeholder="office@example.com">
                            <i class="fa-solid fa-envelope absolute rtl:right-3 ltr:left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2" data-i18n="loginPassword">كلمة المرور</label>
                        <div class="relative">
                            <input type="password" required class="form-input rtl:pr-10 ltr:pl-10" placeholder="••••••••">
                            <i class="fa-solid fa-lock absolute rtl:right-3 ltr:left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2" data-i18n="cvImage">صورة السيرة الذاتية (للعاملـ/ـة)</label>
                    <label for="cv_upload" class="upload-zone group">
                        <div class="w-12 h-12 rounded-full bg-primary/10 dark:bg-slate-700 flex items-center justify-center text-primary dark:text-secondary group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                        </div>
                        <div class="text-sm">
                            <span class="font-bold text-primary dark:text-white" data-i18n="clickToUpload">اضغط هنا لرفع الصورة</span>
                            <span class="text-gray-500 block mt-1" data-i18n="uploadHint">أو قم بسحب وإفلات الملف هنا (JPG, PNG, PDF)</span>
                        </div>
                        <input type="file" id="cv_upload" class="hidden" accept="image/jpeg, image/png, application/pdf" onchange="updateFileName(this)">
                        <div id="file-name" class="text-secondary font-bold text-xs mt-2 hidden"></div>
                    </label>
                </div>

                <button type="submit" class="w-full bg-primary text-white font-extrabold text-base py-4 rounded-xl hover:bg-secondary hover:text-primary transition-all duration-300 shadow-[0_10px_20px_-10px_rgba(17,34,64,0.5)] hover:shadow-[0_10px_20px_-10px_rgba(234,179,8,0.5)] transform hover:-translate-y-1 mt-6">
                    <span data-i18n="registerBtn">إنشاء الحساب وإرسال السيرة الذاتية</span>
                </button>

            </form>

            <div class="mt-6 pt-5 border-t border-gray-100 dark:border-slate-700 text-center">
                <p class="text-gray-500 dark:text-gray-400 text-sm font-semibold">
                    <span data-i18n="haveAccount">لديك حساب بالفعل؟</span> 
                    <a href="login.html" class="text-primary dark:text-secondary font-extrabold hover:underline mx-1 transition-colors" data-i18n="loginNow">تسجيل الدخول</a>
                </p>
            </div>
            
        </div>
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 py-6 mt-auto transition-colors z-20">
        <div class="max-w-7xl mx-auto px-4 flex flex-col justify-center items-center gap-2 text-center">
            <div class="text-slate-400 text-xs font-semibold" dir="auto" data-i18n="footerCopy">
                جميع الحقوق محفوظة لدى | مكتب تمام للإستقدام 2027
            </div>
        </div>
    </footer>

    <script>
        const translations = {
            ar: {
                registerTitlePage: "إنشاء حساب وكيل | بوابة الشركاء - مكتب تمام",
                registerTitle: "تسجيل مكتب جديد",
                registerSubtitle: "قم بإنشاء حسابك وإضافة أول سيرة ذاتية للعمالة",
                officeName: "اسم المكتب",
                workerCountry: "بلد العمالة المتاحة",
                selectCountry: "اختر الدولة...",
                loginEmail: "البريد الإلكتروني (لتسجيل الدخول)",
                loginPassword: "كلمة المرور",
                cvImage: "صورة السيرة الذاتية (للعاملـ/ـة)",
                clickToUpload: "اضغط هنا لرفع الصورة",
                uploadHint: "أو قم بسحب وإفلات الملف هنا (JPG, PNG, PDF)",
                registerBtn: "إنشاء الحساب وإرسال السيرة الذاتية",
                haveAccount: "لديك حساب بالفعل؟",
                loginNow: "تسجيل الدخول",
                footerCopy: "جميع الحقوق محفوظة لدى | مكتب تمام للإستقدام 2027"
            },
            en: {
                registerTitlePage: "Create Agent Account | Partners Portal - Tamam",
                registerTitle: "Register New Office",
                registerSubtitle: "Create your account and add your first CV",
                officeName: "Office Name",
                workerCountry: "Available Worker Country",
                selectCountry: "Select Country...",
                loginEmail: "Email (for login)",
                loginPassword: "Password",
                cvImage: "Curriculum Vitae Image",
                clickToUpload: "Click to upload image",
                uploadHint: "Or drag and drop file here (JPG, PNG, PDF)",
                registerBtn: "Create Account & Submit CV",
                haveAccount: "Already have an account?",
                loginNow: "Login Now",
                footerCopy: "All Rights Reserved | Tamam Recruitment Agency 2027"
            }
        };

        let currentLang = localStorage.getItem('siteLang') || 'ar';
        
        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('siteLang', lang);
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });

            if(translations[lang] && translations[lang]['registerTitlePage']) {
                document.title = translations[lang]['registerTitlePage'];
            }
        }

        function initDarkMode() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if(isDark) {
                document.documentElement.classList.add('dark');
                document.querySelector('#darkModeBtn i').className = 'fa-solid fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                document.querySelector('#darkModeBtn i').className = 'fa-solid fa-moon';
            }
        }

        window.toggleDarkMode = function() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
            document.querySelector('#darkModeBtn i').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        window.switchLanguage = function() { applyLanguage(currentLang === 'ar' ? 'en' : 'ar'); }

        window.updateFileName = function(input) {
            const fileNameDiv = document.getElementById('file-name');
            if(input.files && input.files[0]) {
                fileNameDiv.textContent = 'تم اختيار الملف: ' + input.files[0].name;
                fileNameDiv.classList.remove('hidden');
                fileNameDiv.classList.add('block');
            } else {
                fileNameDiv.classList.add('hidden');
                fileNameDiv.classList.remove('block');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDarkMode();
            applyLanguage(currentLang);
        });
    </script>
</body>
</html>

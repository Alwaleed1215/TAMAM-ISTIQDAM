<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | رفع السير الذاتية - مكتب تمام</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950">

    <main class="max-w-4xl mx-auto py-12 px-4">
        <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-xl p-8 border border-slate-100">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-2xl font-black text-[#112240]">مرحباً بك يا وكيلنا</h1>
                    <p class="text-slate-500">يمكنك البدء برفع السير الذاتية للعمالة من هنا</p>
                </div>
                <a href="login.html" class="text-red-500 font-bold text-sm hover:underline">تسجيل الخروج</a>
            </div>

            <form class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" placeholder="اسم العامل/ـة" class="w-full p-4 rounded-xl border border-slate-200 focus:border-[#eab308] outline-none">
                    <select class="w-full p-4 rounded-xl border border-slate-200 outline-none">
                        <option>المهنة (سائق، عاملة، ممرض...)</option>
                    </select>
                </div>

                <div class="border-2 border-dashed border-slate-200 rounded-2xl p-12 text-center cursor-pointer hover:bg-slate-50 transition-all">
                    <i class="fa-solid fa-file-pdf text-4xl text-[#eab308] mb-4"></i>
                    <p class="font-bold">اسحب ملف السيرة الذاتية هنا</p>
                    <p class="text-xs text-slate-400">يدعم ملفات PDF و الصور فقط</p>
                </div>

                <button class="w-full bg-[#112240] text-white py-4 rounded-xl font-black hover:bg-[#eab308] hover:text-[#112240] transition-all">
                    رفع السيرة الذاتية الآن
                </button>
            </form>
        </div>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="loginTitlePage">تسجيل الدخول | بوابة الشركاء - مكتب تمام</title>
    
    <link rel="icon" type="image/png" href="https://imgg.io/images/2026/03/22/3905f931b0fa4f5e93531423df3036d8.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        primary: '#112240', secondary: '#eab308', whatsapp: '#25D366'
                    },
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeInUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; overflow-x: hidden; width: 100%; transition: background-color 0.3s, color 0.3s; }
        .login-input { @apply w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-12 py-3.5 text-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all text-slate-800 dark:text-slate-100 shadow-inner; }
        .login-icon { @apply absolute top-1/2 -translate-y-1/2 text-gray-400 rtl:right-4 ltr:left-4 text-lg transition-colors; }
        .floating-shape { position: absolute; z-index: -1; filter: blur(40px); opacity: 0.5; animation: float 10s infinite ease-in-out alternate; }
        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-20px) scale(1.05); } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col min-h-screen relative" id="body-content">

    <div class="floating-shape bg-secondary/20 dark:bg-secondary/10 w-64 h-64 rounded-full top-20 right-10"></div>
    <div class="floating-shape bg-primary/20 dark:bg-blue-500/10 w-96 h-96 rounded-full bottom-20 left-10" style="animation-delay: -5s;"></div>

    <header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md shadow-sm sticky top-0 z-30 border-b border-slate-100 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <a href="index.html" class="flex-shrink-0 flex items-center h-full py-1">
                <img src="https://imgg.io/images/2026/03/22/ce7f90873f720d041ffcdb63cfe66b05.png" alt="مكتب تمام للاستقدام" class="h-14 md:h-16 object-contain dark:brightness-0 dark:invert">
            </a>
            <div class="flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="text-primary dark:text-secondary text-lg" id="darkModeBtn"><i class="fa-solid fa-moon"></i></button>
                <button onclick="switchLanguage()" class="text-[10px] border border-primary/20 dark:border-secondary/30 px-2 py-1 rounded bg-slate-50 dark:bg-slate-800 text-primary dark:text-white font-bold transition-colors">EN/AR</button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-12 px-4 relative z-10">
        <div class="w-full max-w-[450px] bg-white dark:bg-slate-800 rounded-[2rem] shadow-2xl border border-slate-100 dark:border-slate-700 p-8 md:p-10 opacity-0 animate-fade-in-up">
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/5 dark:bg-secondary/10 text-primary dark:text-secondary mb-4">
                    <i class="fa-solid fa-user-shield text-3xl"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-primary dark:text-white mb-2" data-i18n="loginTitle">بوابة الوكلاء</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm font-semibold" data-i18n="loginSubtitle">سجل دخولك لإدارة السير الذاتية وطلبات الاستقدام</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div class="relative">
                    <input type="email" id="email" required class="login-input peer" placeholder=" ">
                    <label for="email" class="absolute rtl:right-12 ltr:left-12 top-1/2 -translate-y-1/2 text-gray-400 text-sm transition-all duration-200 peer-focus:-top-2 peer-focus:text-xs peer-focus:text-secondary peer-focus:bg-white dark:peer-focus:bg-slate-800 px-1 peer-valid:-top-2 peer-valid:text-xs peer-valid:bg-white dark:peer-valid:bg-slate-800" data-i18n="loginEmail">البريد الإلكتروني</label>
                    <i class="fa-solid fa-envelope login-icon"></i>
                </div>

                <div class="relative">
                    <input type="password" id="password" required class="login-input peer pr-12" placeholder=" ">
                    <label for="password" class="absolute rtl:right-12 ltr:left-12 top-1/2 -translate-y-1/2 text-gray-400 text-sm transition-all duration-200 peer-focus:-top-2 peer-focus:text-xs peer-focus:text-secondary peer-focus:bg-white dark:peer-focus:bg-slate-800 px-1 peer-valid:-top-2 peer-valid:text-xs peer-valid:bg-white dark:peer-valid:bg-slate-800" data-i18n="loginPassword">كلمة المرور</label>
                    <i class="fa-solid fa-lock login-icon"></i>
                </div>

                <button type="submit" class="w-full bg-primary text-white font-extrabold text-base py-4 rounded-xl hover:bg-secondary hover:text-primary transition-all duration-300 shadow-lg transform hover:-translate-y-1 flex justify-center items-center gap-2">
                    <span data-i18n="loginBtn">تسجيل الدخول الآمن</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-gray-100 dark:border-slate-700 text-center text-sm font-semibold">
                <p class="text-gray-500 dark:text-gray-400">
                    <span data-i18n="loginNoAccount">ليس لديك حساب وكيل؟</span> 
                    <a href="register.html" class="text-primary dark:text-secondary font-extrabold hover:underline mx-1" data-i18n="loginRegisterNow">قدم طلب انضمام</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-100 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center text-slate-400 text-xs font-semibold">
            <div data-i18n="footerCopy">جميع الحقوق محفوظة لدى | مكتب تمام للإستقدام 2027</div>
            <div class="flex gap-4">
                <a href="https://wa.me/966545797339" class="hover:text-whatsapp"><i class="fa-brands fa-whatsapp text-xl"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // دالة التوجيه التلقائي بعد التسجيل
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            // يمكنك إضافة منطق التحقق من الإيميل هنا إذا أردت
            window.location.href = 'dashboard.html'; 
        };

        // بقية دوال الموقع (اللغة، الوضع الليلي)
        let currentLang = localStorage.getItem('siteLang') || 'ar';
        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('siteLang', lang);
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
        }

        const translations = {
            ar: { loginTitle: "بوابة الوكلاء", loginEmail: "البريد الإلكتروني", loginPassword: "كلمة المرور", loginBtn: "تسجيل الدخول الآمن", loginNoAccount: "ليس لديك حساب وكيل؟", loginRegisterNow: "قدم طلب انضمام", footerCopy: "جميع الحقوق محفوظة لدى | مكتب تمام للإستقدام 2027" },
            en: { loginTitle: "Agents Portal", loginEmail: "Email Address", loginPassword: "Password", loginBtn: "Secure Login", loginNoAccount: "No account?", loginRegisterNow: "Apply Now", footerCopy: "All Rights Reserved | Tamam Recruitment 2027" }
        };

        window.toggleDarkMode = function() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
            document.querySelector('#darkModeBtn i').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        window.switchLanguage = function() { applyLanguage(currentLang === 'ar' ? 'en' : 'ar'); }
        
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');
            applyLanguage(currentLang);
        });
    </script>
</body>
</html>
